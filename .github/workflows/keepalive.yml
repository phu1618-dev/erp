name: Render Cloud 24/7 Keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render ERP Health Endpoint
        run: curl --http1.1 -sSf --max-time 30 "https://rpm-configurable-erp.onrender.com/api/v1/health"
