<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đang kết nối Hệ thống Quản trị ERP & Web Bán Hàng...</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F5F5F7;
      color: #1D1D1F;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 20px;
      padding: 32px 28px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.04);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0,0,0,0.08);
      border-top-color: #1D1D1F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 8px; }
    p { font-size: 13px; color: #636366; margin: 0; line-height: 1.5; }
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 16px;
      background: #1D1D1F;
      color: #FFF;
      text-decoration: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="sp"></div>
    <h1 id="title">Đang mở cổng kết nối ERP...</h1>
    <p id="desc">Hệ thống đang tự động định tuyến tới máy chủ đám mây mới nhất của bạn.</p>
    <div id="fallback" style="display:none;"></div>
  </div>
  <script>
    (async function() {
      const GIST_ID = "7539bbb7423f29868bc9ef5c2f5732ad";
      const search = window.location.search || "";
      const hash = window.location.hash || "";

      async function getTunnelUrl() {
        try {
          const r1 = await fetch("https://raw.githubusercontent.com/phu1618-dev/erp/main/tunnel.json?t=" + Date.now(), { cache: "no-store" });
          if (r1.ok) {
            const d1 = await r1.json();
            if (d1 && d1.tunnel_url) return d1.tunnel_url;
          }
        } catch (_) {}
        try {
          const r2 = await fetch("https://api.github.com/gists/" + GIST_ID + "?t=" + Date.now(), { cache: "no-store" });
          if (r2.ok) {
            const d2 = await r2.json();
            const raw = d2 && d2.files && d2.files["rpm_erp_live_tunnel.json"] && d2.files["rpm_erp_live_tunnel.json"].content;
            const parsed = JSON.parse(raw || "{}");
            if (parsed.tunnel_url) return parsed.tunnel_url;
          }
        } catch (_) {}
        return "";
      }

      const tunnelUrl = (await getTunnelUrl()).replace(/\/+$/, "");
      if (tunnelUrl) {
        const target = tunnelUrl + "/app" + search + hash;
        window.location.replace(target);
        setTimeout(() => {
          const fb = document.getElementById("fallback");
          fb.style.display = "block";
          fb.innerHTML = '<a class="btn" href="' + target + '">Bấm vào đây để vào ngay</a>';
        }, 1200);
        return;
      }
      document.getElementById("title").textContent = "Đang làm mới đường truyền máy chủ";
      document.getElementById("desc").textContent = "Vui lòng tải lại trang sau vài giây.";
      setTimeout(() => window.location.reload(), 4000);
    })();
  </script>
</body>
</html>
